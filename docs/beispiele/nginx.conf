# kachink auf LXC 114 (web): nginx mit php-fpm 8.3, ohne Docker.
# Ablegen als /etc/nginx/sites-available/kachink, verlinken nach sites-enabled,
# dann "nginx -t && systemctl reload nginx". TLS terminiert der Edge (Caddy /
# Cloudflare-Tunnel), hier nur HTTP.

server {
    listen 80;
    server_name kachink.croeso.de;

    # Docroot ist api/public (Laravel-Front-Controller + gebautes SPA), nie der Checkout.
    root /var/www/kachink/api/public;
    index index.php index.html;
    charset utf-8;

    client_max_body_size 10m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ /\.(?!well-known) { deny all; }

    # Auto-Deploy: GitHub ruft /__deploy/kachink-deploy, nginx reicht an den
    # Webhook-Daemon (adnanh/webhook) auf dem Host durch.
    location ^~ /__deploy/ {
        proxy_pass http://127.0.0.1:9000/hooks/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    # Gebaute Assets (Vite, gehasht) lange cachen
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API und alles andere ueber den Laravel-Front-Controller; Laravel liefert
    # fuer unbekannte Pfade die SPA-Shell (routes/web.php).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }
}
